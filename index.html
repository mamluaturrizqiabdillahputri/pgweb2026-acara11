<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Judul pada tab browser -->
    <title>Web GIS - GeoServer (Acara 11)</title>
    
    <!-- Leaflet CSS Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    
    <style>
        /* Tampilan peta fullscreen */
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0px;
        }

        /* Styling Kotak Legenda */
        .legend-box {
            background: white;
            padding: 10px 12px;
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
            max-height: 300px;
            overflow-y: auto;
            font-family: Arial, sans-serif;
            font-size: 12px;
            line-height: 1.5;
        }

        .legend-box h4 {
            margin: 0 0 6px 0;
            font-size: 13px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
        }

        .legend-title {
            font-weight: bold;
            margin-top: 6px;
            margin-bottom: 2px;
            display: block;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet, jQuery, dan Plugin L.Geoserver JavaScript Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="lib/L.Geoserver.js"></script>

    <script>
        /* Initial Map */
        var map = L.map('map').setView([-8.33794, 123.12927], 10);

        /* Tile Basemap */
        var basemap1 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        });

        var basemap2 = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: 'Map data &copy; Google'
        });

        basemap2.addTo(map);

        /* Layer 1: Batas Kecamatan dari GeoServer */
        var layerKecamatan = L.tileLayer.wms("http://localhost:8080/geoserver/pgweb/wms", {
            layers: 'pgweb:batas_kecamatan',
            format: 'image/png',
            transparent: true,
            version: '1.1.0',
            attribution: "GeoServer"
        });
        layerKecamatan.addTo(map);

        /* Layer 2: Jaringan Jalan dari GeoServer */
        var layerJalan = L.tileLayer.wms("http://localhost:8080/geoserver/pgweb/wms", {
            layers: 'pgweb:jalan',
            format: 'image/png',
            transparent: true,
            version: '1.1.0',
            attribution: "GeoServer"
        });
        layerJalan.addTo(map);

        /* Control Layer */
        var baseMaps = {
            "Esri Imagery": basemap1,
            "Google Street": basemap2
        };

        var overlayMaps = {
            "Batas Kecamatan": layerKecamatan,
            "Jaringan Jalan": layerJalan
        };

        L.control.layers(baseMaps, overlayMaps, {collapsed: false}).addTo(map);

        /* Legenda Otomatis dari GeoServer (GetLegendGraphic) */
        var legend = L.control({ position: 'bottomleft' });

        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend-box');
            div.innerHTML =
                '<h4>Legenda</h4>' +
                '<span class="legend-title">Jaringan Jalan</span>' +
                '<img src="http://localhost:8080/geoserver/pgweb/wms?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&LAYER=pgweb:jalan" alt="Legenda Jalan"><br>' +
                '<span class="legend-title">Batas Kecamatan</span>' +
                '<img src="http://localhost:8080/geoserver/pgweb/wms?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&LAYER=pgweb:batas_kecamatan" alt="Legenda Kecamatan">';
            
            // Mencegah peta ikut ter-zoom/geser saat scroll di dalam kotak legenda
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);
            return div;
        };

        legend.addTo(map);

        /* Scale Bar */
        L.control.scale({
            maxWidth: 150, 
            position: 'bottomright'
        }).addTo(map);
    </script>
</body>
</html>
